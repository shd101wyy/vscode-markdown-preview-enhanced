name: "Test"
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: 'Install pnpm'
        uses: pnpm/action-setup@v4
        # The pnpm version is read from the packageManager field in package.json
      - name: 'Install nodejs'
        # Node 18: the runtime of the VS Code extension host this extension
        # must load on (see the Runtime Support note in AGENTS.md). Read from
        # .tool-versions to stay in sync with the nix dev shell.
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: 'Build and test'
        run: |
          pnpm install --frozen-lockfile
          npm install -g @vscode/vsce@2.32.0
          pnpm run check:all
          # Build before test: test/native-runtime-compat.test.js loads the
          # bundle from out/native/ to guard the shipped artifact against
          # Node-20-only dependencies (#2394).
          pnpm run build
          pnpm test
          # --no-dependencies: vsce's built-in dependency check runs
          # `npm list`, which fails on pnpm's symlinked node_modules layout.
          # The extension is fully bundled by esbuild, so runtime
          # dependencies don't need to be analyzed.
          vsce package --no-dependencies
          ls -lah *.vsix
      - name: Dry run publish to Visual Studio Marketplace
        id: dry_run_vsix
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          dryRun: true
          pat: stub
          registryUrl: https://marketplace.visualstudio.com
          dependencies: false
      - name: Dry run publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          dryRun: true
          pat: stub
          registryUrl: https://open-vsx.org
          extensionFile: ${{ steps.dry_run_vsix.outputs.vsixPath }}
          dependencies: false