name: "Test"
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: 'Install nodejs 20'
        uses: actions/setup-node@v2
        with:
          node-version: '20'
      - name: 'Install pnpm'
        uses: pnpm/action-setup@v4
        # The pnpm version is read from the packageManager field in package.json
      - name: 'Build and test'
        run: |
          pnpm install --frozen-lockfile
          npm install -g @vscode/vsce
          pnpm run check:all
          pnpm run build
          # pnpm test
          # --no-dependencies: vsce's built-in dependency check runs
          # `npm list`, which fails on pnpm's symlinked node_modules layout.
          # The extension is fully bundled by esbuild, so runtime
          # dependencies don't need to be analyzed.
          vsce package --no-dependencies
          ls -lah *.vsix
      - name: Dry run publish to Visual Studio Marketplace
        id: dry_run_vsix
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          dryRun: true
          pat: stub
          registryUrl: https://marketplace.visualstudio.com
          dependencies: false
      - name: Dry run publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          dryRun: true
          pat: stub
          registryUrl: https://open-vsx.org
          extensionFile: ${{ steps.dry_run_vsix.outputs.vsixPath }}
          dependencies: false